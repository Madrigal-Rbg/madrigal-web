    <circle cx="440" cy="220" r="6"/><circle cx="120" cy="260" r="6"/>
    <circle cx="220" cy="360" r="6"/><circle cx="400" cy="360" r="6"/>
    <circle cx="120" cy="400" r="6"/><circle cx="320" cy="400" r="6"/>
    <circle cx="880" cy="140" r="6"/><circle cx="700" cy="250" r="6"/>
    <circle cx="560" cy="250" r="6"/><circle cx="880" cy="300" r="6"/>
    <circle cx="760" cy="390" r="6"/><circle cx="600" cy="390" r="6"/>
  </g>
  <!-- central code brackets -->
  <g stroke="url(#sc)" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M450 200 L410 250 L450 300"/>
    <path d="M550 200 L590 250 L550 300"/>
    <line x1="510" y1="195" x2="490" y2="305"/>
  </g>
