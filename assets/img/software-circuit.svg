<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="Abstract circuit board with code brackets">
  <defs>
    <linearGradient id="sc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23B4EC"/><stop offset="0.6" stop-color="#1379C2"/>
      <stop offset="1" stop-color="#6E8BFF"/>
    </linearGradient>
  </defs>
  <g stroke="url(#sc)" stroke-width="2" fill="none" opacity="0.8" stroke-linecap="round">
    <path d="M120 120 H300 V220 H440"/>
    <path d="M120 260 H220 V360 H400"/>
    <path d="M120 400 H320"/>
    <path d="M880 140 H700 V250 H560"/>
    <path d="M880 300 H760 V390 H600"/>
    <path d="M500 80 V160"/>
    <path d="M500 340 V440"/>
