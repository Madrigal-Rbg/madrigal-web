<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Minimalist Hong Kong skyline silhouette">
  <defs>
    <linearGradient id="hk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23B4EC"/><stop offset="1" stop-color="#0C5FB0"/>
    </linearGradient>
    <linearGradient id="hkw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1379C2" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#6E8BFF" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <g fill="url(#hk)">
    <rect x="40" y="220" width="34" height="100"/>
    <rect x="84" y="180" width="40" height="140"/>
    <rect x="134" y="150" width="30" height="170"/>
    <!-- tapered tower (IFC-like) -->
    <polygon points="180,320 180,120 196,90 212,120 212,320"/>
    <rect x="230" y="170" width="44" height="150"/>
    <rect x="284" y="140" width="30" height="180"/>
    <!-- Bank of China-like angular tower -->
    <polygon points="330,320 330,70 352,40 374,90 374,320"/>
    <rect x="392" y="190" width="36" height="130"/>
    <rect x="438" y="160" width="46" height="160"/>
    <rect x="494" y="120" width="30" height="200"/>
    <polygon points="540,320 540,100 558,70 576,100 576,320"/>
    <rect x="596" y="180" width="42" height="140"/>
    <rect x="648" y="150" width="32" height="170"/>
    <rect x="690" y="200" width="40" height="120"/>
    <polygon points="746,320 746,90 766,60 786,90 786,320"/>
    <rect x="806" y="170" width="36" height="150"/>
    <rect x="852" y="200" width="46" height="120"/>
    <rect x="908" y="230" width="34" height="90"/>
  </g>
  <!-- water reflection -->
  <rect x="0" y="322" width="1000" height="38" fill="url(#hkw)"/>
  <g stroke="#6E8BFF" stroke-width="2" opacity="0.5">
    <line x1="190" y1="328" x2="190" y2="346"/>
    <line x1="352" y1="328" x2="352" y2="350"/>
    <line x1="558" y1="328" x2="558" y2="346"/>
    <line x1="766" y1="328" x2="766" y2="348"/>
  </g>
</svg>
