<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Minimalist Lugano lake and mountains silhouette">
  <defs>
    <linearGradient id="lgm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1379C2"/><stop offset="1" stop-color="#0C5FB0"/>
    </linearGradient>
    <linearGradient id="lgm2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23B4EC"/><stop offset="1" stop-color="#1379C2"/>
    </linearGradient>
    <linearGradient id="lglake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E8BFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0C5FB0" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- far mountains (San Salvatore / Monte Bre style peaks) -->
  <path d="M0 250 L150 120 L260 200 L420 80 L560 200 L720 110 L860 210 L1000 150 L1000 260 L0 260 Z" fill="url(#lgm)" opacity="0.75"/>
  <!-- near twin peaks -->
  <path d="M0 260 L120 190 L240 250 L360 160 L470 250 L600 170 L740 250 L880 190 L1000 240 L1000 270 L0 270 Z" fill="url(#lgm2)"/>
  <!-- lakeside town strip -->
  <g fill="#0C5FB0">
    <rect x="320" y="262" width="14" height="20"/><rect x="338" y="258" width="10" height="24"/>
    <rect x="352" y="264" width="14" height="18"/><rect x="372" y="256" width="10" height="26"/>
    <rect x="386" y="262" width="14" height="20"/><rect x="404" y="260" width="12" height="22"/>
    <rect x="600" y="262" width="14" height="20"/><rect x="618" y="258" width="10" height="24"/>
    <rect x="632" y="264" width="14" height="18"/><rect x="652" y="260" width="12" height="22"/>
  </g>
  <!-- lake -->
  <rect x="0" y="282" width="1000" height="78" fill="url(#lglake)"/>
  <g stroke="#6E8BFF" stroke-width="2" opacity="0.4">
    <line x1="120" y1="300" x2="240" y2="300"/>
    <line x1="500" y1="318" x2="700" y2="318"/>
    <line x1="300" y1="336" x2="520" y2="336"/>
  </g>
</svg>
