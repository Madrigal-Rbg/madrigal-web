<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Candlestick chart with trend line">
  <defs>
    <linearGradient id="fg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0C5FB0"/>
      <stop offset="0.5" stop-color="#1379C2"/>
      <stop offset="1" stop-color="#23B4EC"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E8BFF"/>
      <stop offset="1" stop-color="#23B4EC"/>
    </linearGradient>
  </defs>
  <g stroke="#1379C2" stroke-width="1" opacity="0.18">
    <line x1="60" y1="120" x2="940" y2="120"/>
    <line x1="60" y1="240" x2="940" y2="240"/>
    <line x1="60" y1="360" x2="940" y2="360"/>
    <line x1="60" y1="480" x2="940" y2="480"/>
  </g>
  <!-- candles: x, wickTop, wickBot, bodyTop, bodyH -->
  <g stroke="url(#fg)" stroke-width="2.5">
    <line x1="120" y1="300" x2="120" y2="430"/>
    <line x1="200" y1="260" x2="200" y2="400"/>
    <line x1="280" y1="220" x2="280" y2="380"/>
    <line x1="360" y1="250" x2="360" y2="410"/>
    <line x1="440" y1="180" x2="440" y2="340"/>
    <line x1="520" y1="200" x2="520" y2="320"/>
    <line x1="600" y1="140" x2="600" y2="300"/>
    <line x1="680" y1="170" x2="680" y2="290"/>
    <line x1="760" y1="110" x2="760" y2="260"/>
    <line x1="840" y1="150" x2="840" y2="250"/>
  </g>
  <g fill="url(#fg)" rx="3">
    <rect x="110" y="330" width="20" height="70" rx="3"/>
    <rect x="190" y="290" width="20" height="80" rx="3"/>
    <rect x="270" y="250" width="20" height="100" rx="3"/>
    <rect x="350" y="290" width="20" height="70" rx="3"/>
    <rect x="430" y="220" width="20" height="90" rx="3"/>
    <rect x="510" y="230" width="20" height="60" rx="3"/>
    <rect x="590" y="180" width="20" height="90" rx="3"/>
    <rect x="670" y="200" width="20" height="60" rx="3"/>
    <rect x="750" y="150" width="20" height="80" rx="3"/>
    <rect x="830" y="180" width="20" height="50" rx="3"/>
  </g>
  <path d="M120 380 L200 330 L280 300 L360 330 L440 270 L520 260 L600 220 L680 230 L760 180 L840 200"
        fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <g fill="#23B4EC">
    <circle cx="760" cy="180" r="5"/><circle cx="840" cy="200" r="5"/>
  </g>
</svg>
