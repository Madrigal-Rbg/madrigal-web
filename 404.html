<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Madrigal Consulting</title>
  <meta name="robots" content="noindex" />

  <!-- Smart redirect: the new site is single-page, so legacy URLs from the old
       CM4all site (e.g. /IT-Outsourcing/, /Contact-Us/, and the broken
       /https/-/madrigalconsulting-io/ canonical) map to the matching section.
       Keyword-based so hyphenated variants are caught generically. Runs before
       paint; unrecognized paths fall through to the branded 404 below. -->
  <script>
    (function () {
      var path = location.pathname.toLowerCase();
      function go(s) { location.replace(s === "home" ? "/" : "/#" + s); }
      // Old CM4all broken home/canonical link -> homepage
      if (path.indexOf("madrigalconsulting-io") !== -1 || /^\/https?\//.test(path)) {
        location.replace("/"); return;
      }
      var seg = path.replace(/^\/+|\/+$/g, "").split("/")[0].replace(/_/g, "-");
      if (!seg) return;
      // Exact matches first — precise for short/ambiguous tokens and utility/legal
      // pages that have no dedicated section (those go to the homepage).
      var exact = {
        "ai": "ai", "home": "home", "index": "home", "homepage": "home",
        "blog": "home", "news": "home", "faq": "home", "faqs": "home", "sitemap": "home",
        "privacy": "home", "privacy-policy": "home", "cookie-policy": "home", "cookies": "home",
        "terms": "home", "terms-of-service": "home", "terms-and-conditions": "home",
        "legal": "home", "impressum": "home", "imprint": "home",
        "pricing": "contact", "prezzi": "contact", "quote": "contact",
        "clients": "work", "careers": "work", "career": "work", "jobs": "work", "why-us": "work", "team": "work",
        "hong-kong": "global", "hongkong": "global", "lugano": "global",
        "milan": "global", "milano": "global", "switzerland": "global", "italy": "global"
      };
      if (Object.prototype.hasOwnProperty.call(exact, seg)) { go(exact[seg]); return; }
      // Keyword-contains fallback (ordered: most specific first; no ambiguous short tokens)
      var rules = [
        ["penetration", "cyber"], ["pentest", "cyber"], ["red-team", "cyber"], ["redteam", "cyber"],
        ["vulnerab", "cyber"], ["cyber", "cyber"], ["security", "cyber"], ["secure-code", "cyber"],
        ["code-review", "cyber"], ["code-audit", "cyber"], ["audit", "cyber"], ["compliance", "cyber"],
        ["infosec", "cyber"], ["threat", "cyber"], ["forensic", "cyber"],
        ["artificial", "ai"], ["intelligence", "ai"], ["machine-learning", "ai"], ["deep-learning", "ai"],
        ["generative", "ai"], ["llm", "ai"], ["mlops", "ai"], ["computer-vision", "ai"], ["chatbot", "ai"], ["agent", "ai"],
        ["outsourcing", "services"], ["digital-marketing", "services"], ["marketing", "services"],
        ["branding", "services"], ["brand", "services"], ["content", "services"], ["seo", "services"],
        ["analytics", "services"], ["mobile", "services"], ["iot", "services"], ["service", "services"], ["servizi", "services"],
        ["software", "software"], ["development", "software"], ["fintech", "software"], ["crypto", "software"],
        ["blockchain", "software"], ["wallet", "software"], ["exchange", "software"], ["banking", "software"], ["aml", "software"],
        ["hosting", "hosting"], ["domain", "hosting"], ["domini", "hosting"], ["server", "hosting"],
        ["infrastructure", "hosting"], ["infrastruttura", "hosting"], ["cloud", "hosting"],
        ["process", "process"], ["approach", "process"], ["metodo", "process"], ["how-we-work", "process"],
        ["about", "work"], ["who-we-are", "work"], ["chi-siamo", "work"], ["company", "work"], ["why", "work"],
        ["client", "work"], ["career", "work"], ["job", "work"], ["portfolio", "work"], ["case-stud", "work"], ["work", "work"],
        ["global", "global"], ["office", "global"], ["location", "global"], ["presence", "global"], ["sedi", "global"], ["hong", "global"],
        ["contact", "contact"], ["contatti", "contact"], ["get-in-touch", "contact"], ["touch", "contact"],
        ["enquir", "contact"], ["inquir", "contact"], ["reach-us", "contact"], ["pricing", "contact"], ["price", "contact"]
      ];
      for (var i = 0; i < rules.length; i++) {
        if (seg.indexOf(rules[i][0]) !== -1) { go(rules[i][1]); return; }
      }
    })();
  </script>
  <meta name="theme-color" content="#060A14" />
  <link rel="icon" type="image/png" sizes="196x196" href="assets/favicon-196.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .nf{min-height:100vh;display:grid;place-items:center;text-align:center;padding:2rem;position:relative;overflow:hidden;
      background:radial-gradient(ellipse 100% 80% at 50% 40%,#0A1530 0%,#05080F 75%);}
    .nf__inner{position:relative;z-index:2;max-width:600px;}
    .nf__logo{height:46px;width:auto;margin:0 auto 2.4rem;filter:drop-shadow(0 0 16px rgba(35,180,236,.45)) drop-shadow(0 1px 2px rgba(0,0,0,.5));}
    .nf__code{font-family:var(--font-display);font-weight:700;font-size:clamp(4.5rem,18vw,9rem);line-height:1;letter-spacing:-.03em;margin:0 0 .6rem;}
    .nf__eyebrow{font-family:var(--font-mono);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 1.6rem;}
    .nf p{color:var(--muted);font-size:1.1rem;line-height:1.7;margin:0 0 2.2rem;}
    .nf p .alt{display:block;opacity:.65;font-size:.98rem;margin-top:.35rem;}
  </style>
</head>
<body>
  <main class="nf">
    <div class="aurora" aria-hidden="true"><span class="blob blob--1"></span><span class="blob blob--3"></span></div>
    <div class="grid-overlay" aria-hidden="true"></div>
    <div class="nf__inner">
      <img class="nf__logo" src="assets/logo.png" alt="Madrigal Consulting" />
      <p class="nf__eyebrow">// SIGNAL LOST</p>
      <h1 class="nf__code gradient-text gradient-text--drift">404</h1>
      <p>
        This page drifted off the map. Let's get you back to base.
        <span class="alt">Questa pagina si è persa per strada. Torniamo alla base.</span>
      </p>
      <a class="btn btn--gradient" href="/">Back to home · Torna alla home</a>
    </div>
  </main>
</body>
</html>
